spring.application.name=celu-canje

# Servidor local
server.address=127.0.0.1
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/celu_canje}
spring.datasource.username=${DB_USERNAME:celu_canje_app}
spring.datasource.password=${DB_PASSWORD}

# Persistencia
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Comprobacion del servicio
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Duracion de reserva: 15 minutos
app.reservations.duration-seconds=900

# Revision de vencimientos: cada 15 segundos
app.reservations.cleanup-delay-ms=15000
# Deshabilitado salvo activacion explicita del entorno
app.payments.test-enabled=${PAYMENTS_TEST_ENABLED:false}
app.warranties.expiring-soon-days=15

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
spring.config.import=file:${user.home}/Documents/celu-canje/backend/config/gemini-local.properties